<!doctype html>
<html lang="en" data-holiday="christmas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Holiday Gift List</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gift List">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13462d" id="themeColor">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: holiday header band (scene + switch), striped progress, then Family / Friends cards alternating two holiday colors */
:root{
  --bg:#f2f6f1; --paper:#ffffff; --ink:#1c2a21; --muted:#5a6b60; --line:#d5e0d7;
  --pri:#c8102e; --pri2:#e0596b; --sec:#1d6a42; --gold:#c9951a;
  --hdr:#13462d; --hdr-ink:#f7fbf7; --hdr-soft:#a9cdb6;
  --cardA:#b8112c; --cardA2:#d23048; --cardB:#1a6140; --cardB2:#2a7d55;
  --on-card:#ffffff; --on-card-soft:rgba(255,255,255,.74); --on-card-line:rgba(255,255,255,.3);
  --sun:#ffe08a; --sun-ink:#3a2a00;
  --skin:#f3caa9; --beard:#ffffff; --cookie:#cf8f4f; --chip:#4a2b16; --plate:#f4f1ec;
  --shadow:0 1px 2px rgba(20,40,30,.08),0 6px 18px rgba(20,40,30,.07);
  --display:"Berkshire Swash",Georgia,"Times New Roman",serif;
  --body:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-holiday="hanukkah"]{
  --bg:#eef2fa; --ink:#16223a; --muted:#56637d; --line:#d3dcec;
  --pri:#1f4fa8; --pri2:#6c97dc; --sec:#1f4fa8; --gold:#c9951a;
  --hdr:#0f2a5c; --hdr-soft:#a9bfe6;
  --cardA:#173a7e; --cardA2:#2a55a8; --cardB:#2f6dc2; --cardB2:#4c89d8;
}
*{box-sizing:border-box}
html{background:var(--hdr)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;transition:background .4s}
img{max-width:100%} [hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--hdr);color:var(--hdr-ink);position:relative;overflow:hidden;transition:background .4s}
header .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:10px}
.snow{position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(circle,var(--hdr-ink) 1.2px,transparent 1.6px),radial-gradient(circle,var(--hdr-ink) .8px,transparent 1.2px);
  background-size:46px 46px,29px 29px;background-position:0 0,13px 17px;animation:snow 14s linear infinite}
[data-holiday="hanukkah"] .snow{animation:twinkle 4s ease-in-out infinite;opacity:.35}
@keyframes snow{to{background-position:0 460px,13px 307px}}
@keyframes twinkle{50%{opacity:.15}}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--hdr-soft);margin-bottom:4px}
.deco{width:84px;height:84px;flex:none}
.switch{position:relative;display:inline-flex;align-self:flex-start;background:rgba(255,255,255,.12);border-radius:999px;padding:4px;gap:4px}
.switch button{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:999px;padding:7px 14px;background:transparent;color:var(--hdr-soft);cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--hdr-ink);color:var(--hdr)}
.scene{position:relative;width:100%;max-width:440px;align-self:center}
.scene svg{display:block;width:100%;height:auto}
.caption{position:relative;text-align:center;font-weight:700;color:var(--hdr-soft);font-size:15px;padding-bottom:16px;min-height:2.6em;text-wrap:balance}

.progress{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 18px;margin-top:-6px;position:relative;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:26px;line-height:1;color:var(--pri)}
.pmeta{font-size:14px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.bar{position:relative;height:22px;border-radius:11px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:9px;transition:width .6s cubic-bezier(.3,1.3,.5,1);
  background:repeating-linear-gradient(-45deg,var(--pri) 0 10px,#ffffff 10px 20px);background-size:28.3px 28.3px;animation:march 1.2s linear infinite}
@keyframes march{to{background-position:28.3px 0}}
.bar.full .fill{background:repeating-linear-gradient(-45deg,var(--gold) 0 10px,#ffffff 10px 20px);background-size:28.3px 28.3px}

main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:22px}
.intro{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;color:var(--muted);font-weight:600}
.intro b{color:var(--ink)}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--sec);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:6px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--pri) 0 6px,transparent 6px 12px);opacity:.5}
.section{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}

.card{--cbg:var(--cardA);--cbg2:var(--cardA2);position:relative;overflow:hidden;border-radius:16px;box-shadow:var(--shadow);padding:20px 14px 14px;
  display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--on-card);
  background:radial-gradient(circle at 92% 8%,var(--cbg2) 0 46px,transparent 47px),var(--cbg)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(-45deg,#ffffff 0 8px,var(--cbg2) 8px 16px)}
.grid .card:nth-child(even){--cbg:var(--cardB);--cbg2:var(--cardB2)}
@media (min-width:640px){
  .grid .card:nth-child(4n+3){--cbg:var(--cardB);--cbg2:var(--cardB2)}
  .grid .card:nth-child(4n+4){--cbg:var(--cardA);--cbg2:var(--cardA2)}
}
.card.done{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
.chead{display:flex;align-items:center;gap:8px}
.cname{font-family:var(--display);font-size:24px;line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.count{font-size:13px;font-weight:800;color:var(--on-card-soft);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sun);color:var(--sun-ink)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--on-card-line)}
li:last-child{border-bottom:0}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid rgba(255,255,255,.75);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .2s}
.check[aria-checked="true"]{border-color:#ffffff;background:#ffffff}
.check[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.check[aria-checked="true"] path{stroke:var(--cbg)}
.check:active{transform:scale(.9)}
.gtext{flex:1;min-width:0;overflow-wrap:anywhere}
li.got .gtext{text-decoration:line-through;text-decoration-thickness:2px;color:var(--on-card-soft)}
.yearly{flex:none;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;cursor:pointer;border:1px dashed var(--on-card-line);background:transparent;color:var(--on-card-soft)}
.yearly[aria-pressed="true"]{border:1px solid var(--sun);color:var(--sun)}
.x{flex:none;width:28px;height:28px;border:0;background:transparent;color:var(--on-card-soft);font-size:20px;line-height:1;cursor:pointer;border-radius:8px}
.x:hover{color:#fff;background:rgba(255,255,255,.15)}
.empty{color:var(--on-card-soft);font-size:14px;font-style:italic;padding:4px 0}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:2px solid var(--on-card-line);background:rgba(255,255,255,.14);color:var(--on-card)}
.add input::placeholder{color:var(--on-card-soft)}
.add input:focus{outline:none;border-color:#fff}
.btn{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#ffffff;color:var(--cbg)}
.btn.ghost{background:transparent;color:#fff;border:2px solid var(--on-card-line)}
.btn.warn{background:var(--sun);color:var(--sun-ink)}
.rm{align-self:flex-end;font-size:13px;font-weight:700;color:var(--on-card-soft);background:none;border:0;cursor:pointer;padding:2px 0;text-decoration:underline}
.addp{display:flex;gap:8px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:12px}
.addp input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.addp input:focus{outline:none;border-color:var(--sec)}
.addp .btn{background:var(--pri);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.reset{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-top:2px dashed var(--line);padding-top:18px;font-size:14px;color:var(--muted)}
.reset .row{display:flex;gap:8px;flex-wrap:wrap}
.reset .btn{background:var(--pri);color:#fff}
.reset .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--hdr);color:var(--hdr-ink);
  padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

/* Holiday visibility */
[data-holiday="christmas"] .hk{display:none}
[data-holiday="hanukkah"] .xm{display:none}

/* Santa */
#santa .eyesShut,#santa .zz,#santa .sleepMouth{opacity:0}
#santa #head{transform-box:view-box;transform-origin:150px 120px;transition:transform .8s ease}
#bite{opacity:0;transform-box:view-box;transform-origin:150px 122px}
#santa.eating #bite{animation:bring 2.6s ease forwards}
@keyframes bring{0%{opacity:1;transform:translate(110px,62px) scale(.6)}22%{opacity:1;transform:translate(0,0) scale(1)}80%{opacity:1;transform:translate(0,0) scale(1)}90%,100%{opacity:0;transform:translate(0,0) scale(1)}}
#biteMask circle{opacity:0}
#santa.eating .b1{animation:bitein 2.6s steps(1) forwards;animation-delay:.75s}
#santa.eating .b2{animation:bitein 2.6s steps(1) forwards;animation-delay:1.2s}
#santa.eating .b3{animation:bitein 2.6s steps(1) forwards;animation-delay:1.65s}
#santa.eating .b4{animation:bitein 2.6s steps(1) forwards;animation-delay:2.05s}
@keyframes bitein{to{opacity:1}}
#mouth{transform-box:fill-box;transform-origin:center}
#santa.eating #mouth{animation:chomp .45s ease-in-out 5 .6s}
@keyframes chomp{50%{transform:scaleY(2.4)}}
.crumb{opacity:0}
#santa.eating .crumb{animation:crumb 1.4s ease-in forwards;animation-delay:var(--d)}
@keyframes crumb{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),46px)}}
#santa.napping #head{transform:rotate(14deg)}
#santa.napping .eyesOpen,#santa.napping #mouth{opacity:0}
#santa.napping .eyesShut,#santa.napping .sleepMouth{opacity:1}
#santa.napping .zz{animation:zz 3s ease-in-out infinite}
#santa.napping .zz:nth-of-type(2){animation-delay:1s}
#santa.napping .zz:nth-of-type(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,8px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-16px)}}

/* Menorah + dreidel */
.flame{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .4s}
.flame.on{opacity:1;animation:flicker 1.6s ease-in-out infinite}
.flame.on:nth-of-type(odd){animation-duration:1.9s}
@keyframes flicker{50%{transform:scale(.88,1.08) rotate(2deg)}}
#menorahGlow{opacity:0;transition:opacity 1s}
#menorah.alllit #menorahGlow{opacity:1}
#dreidel{transform-box:view-box;transform-origin:300px 204px}
#menorah.spinning #dreidel{animation:spin 2.4s cubic-bezier(.2,.6,.4,1)}
#dreidelBody{transform-box:view-box;transform-origin:300px 160px}
#menorah.spinning #dreidelBody{animation:squish .2s linear 10}
@keyframes spin{0%{transform:translate(0,-26px) rotate(0)}10%{transform:translate(-8px,0) rotate(-10deg)}30%{transform:translate(6px,0) rotate(8deg)}50%{transform:translate(-5px,0) rotate(-7deg)}70%{transform:translate(4px,0) rotate(5deg)}85%{transform:rotate(-14deg)}93%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes squish{50%{transform:scaleX(.25)}}
@media (prefers-reduced-motion:reduce){.snow,.fill,.flame.on{animation:none}#santa.napping .zz{animation:none;opacity:1}}
</style>
</head>
<body>
<header>
  <div class="snow"></div>
  <div class="wrap">
    <div class="titlerow">
      <h1><small id="kicker">Christmas shopping</small>Holiday Gift List</h1>
      <svg class="deco xm" viewBox="0 0 90 90" aria-hidden="true">
        <defs>
          <pattern id="caneStripe" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
            <rect width="9" height="9" fill="#ffffff"/><rect width="4" height="9" fill="#d5122f"/>
          </pattern>
          <g id="oneCane">
            <path d="M0 34 V-24 a11 11 0 0 1 22 0 v6" fill="none" stroke="#7a0c1d" stroke-width="11" stroke-linecap="round" opacity=".35"/>
            <path d="M0 34 V-24 a11 11 0 0 1 22 0 v6" fill="none" stroke="url(#caneStripe)" stroke-width="9" stroke-linecap="round"/>
          </g>
        </defs>
        <use href="#oneCane" transform="translate(45 50) rotate(-24) scale(-1 1)"/>
        <use href="#oneCane" transform="translate(45 50) rotate(24)"/>
        <g transform="translate(45 52)">
          <path d="M0 0 L-13 -8 Q-16 0 -13 8 Z M0 0 L13 -8 Q16 0 13 8 Z" fill="#2f9a5f"/>
          <path d="M-1 2 L-6 14 M1 2 L6 14" stroke="#2f9a5f" stroke-width="3" stroke-linecap="round"/>
          <circle r="4" fill="#e7b63c"/>
        </g>
      </svg>
      <svg class="deco hk" viewBox="0 0 90 90" aria-hidden="true">
        <g fill="none" stroke="#e7b63c" stroke-width="5" stroke-linejoin="round">
          <path d="M45 12 L74 62 L16 62 Z"/><path d="M45 78 L16 28 L74 28 Z"/>
        </g>
      </svg>
    </div>
    <div class="switch" role="group" aria-label="Holiday">
      <button type="button" id="btnXmas" data-hol="christmas" aria-pressed="true">Christmas</button>
      <button type="button" id="btnHk" data-hol="hanukkah" aria-pressed="false">Hanukkah</button>
    </div>

    <div class="scene xm">
      <svg id="santa" viewBox="0 0 340 214" role="img" aria-label="Santa at a table with a plate of cookies">
        <defs>
          <mask id="biteMask" maskUnits="userSpaceOnUse" x="0" y="0" width="340" height="214">
            <rect x="0" y="0" width="340" height="214" fill="#fff"/>
            <circle class="b1" cx="164" cy="112" r="8" fill="#000"/>
            <circle class="b2" cx="138" cy="114" r="8" fill="#000"/>
            <circle class="b3" cx="160" cy="132" r="9" fill="#000"/>
            <circle class="b4" cx="150" cy="122" r="16" fill="#000"/>
          </mask>
        </defs>
        <rect x="200" y="192" width="140" height="22" rx="4" fill="#7a4a2a"/>
        <rect x="196" y="188" width="148" height="8" rx="4" fill="#94603a"/>
        <rect x="306" y="150" width="20" height="38" rx="4" fill="#ffffff" opacity=".92"/>
        <rect x="306" y="150" width="20" height="8" rx="3" fill="#dfe8f0"/>
        <ellipse cx="258" cy="186" rx="50" ry="8" fill="var(--plate)" stroke="#c9c2b7" stroke-width="1.5"/>
        <g id="plate"></g>
        <g>
          <path d="M92 214 V168 Q92 128 150 128 Q208 128 208 168 V214 Z" fill="#c8102e"/>
          <rect x="144" y="130" width="12" height="84" fill="#ffffff"/>
          <rect x="92" y="176" width="116" height="13" fill="#222"/>
          <rect x="140" y="173" width="20" height="19" rx="3" fill="none" stroke="#e7b63c" stroke-width="3.5"/>
        </g>
        <ellipse cx="96" cy="170" rx="13" ry="30" fill="#b00d27" transform="rotate(14 96 170)"/>
        <ellipse cx="204" cy="168" rx="13" ry="28" fill="#b00d27" transform="rotate(-36 204 168)"/>
        <circle cx="219" cy="186" r="9" fill="#1d5c3a"/>
        <circle cx="88" cy="198" r="9" fill="#1d5c3a"/>
        <g id="head">
          <circle cx="150" cy="92" r="30" fill="var(--skin)"/>
          <circle cx="130" cy="98" r="6" fill="#ee8e8e" opacity=".55"/>
          <circle cx="170" cy="98" r="6" fill="#ee8e8e" opacity=".55"/>
          <g class="eyesOpen" fill="#2a1a12"><circle cx="139" cy="87" r="3.4"/><circle cx="161" cy="87" r="3.4"/></g>
          <g class="eyesShut" fill="none" stroke="#2a1a12" stroke-width="2.4" stroke-linecap="round"><path d="M133 87 q6 5 12 0"/><path d="M155 87 q6 5 12 0"/></g>
          <path d="M131 79 q8 -6 15 -1 M154 78 q8 -5 15 1" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <g fill="var(--beard)">
            <circle cx="121" cy="104" r="15"/><circle cx="131" cy="119" r="17"/><circle cx="150" cy="128" r="19"/>
            <circle cx="169" cy="119" r="17"/><circle cx="179" cy="104" r="15"/>
          </g>
          <ellipse id="mouth" cx="150" cy="113" rx="5" ry="3" fill="#7a1f1f"/>
          <path class="sleepMouth" d="M145 113 q5 3 10 0" fill="none" stroke="#7a1f1f" stroke-width="2.2" stroke-linecap="round"/>
          <ellipse cx="140" cy="105" rx="12" ry="6" fill="var(--beard)"/>
          <ellipse cx="160" cy="105" rx="12" ry="6" fill="var(--beard)"/>
          <circle cx="150" cy="98" r="6.5" fill="#e59a86"/>
          <path d="M116 76 Q120 36 152 34 Q190 33 208 64 L196 72 Q182 54 172 58 Q184 66 184 76 Z" fill="#c8102e"/>
          <rect x="112" y="68" width="76" height="15" rx="7.5" fill="#ffffff"/>
          <circle cx="203" cy="70" r="9" fill="#ffffff"/>
        </g>
        <g id="bite">
          <g mask="url(#biteMask)">
            <circle cx="150" cy="122" r="14" fill="var(--cookie)" stroke="#a86b33" stroke-width="1.5"/>
            <circle cx="145" cy="117" r="2.2" fill="var(--chip)"/><circle cx="156" cy="121" r="2.2" fill="var(--chip)"/>
            <circle cx="147" cy="128" r="2.2" fill="var(--chip)"/><circle cx="154" cy="113" r="1.8" fill="var(--chip)"/>
          </g>
        </g>
        <g fill="var(--cookie)">
          <circle class="crumb" cx="146" cy="138" r="2" style="--d:.9s;--x:-14px"/>
          <circle class="crumb" cx="154" cy="138" r="1.6" style="--d:1.3s;--x:10px"/>
          <circle class="crumb" cx="150" cy="140" r="2.2" style="--d:1.7s;--x:-4px"/>
          <circle class="crumb" cx="158" cy="136" r="1.5" style="--d:2.1s;--x:16px"/>
        </g>
        <g font-family="Berkshire Swash, Georgia, serif" fill="#ffffff">
          <text class="zz" x="214" y="52" font-size="18">z</text>
          <text class="zz" x="228" y="36" font-size="24">Z</text>
          <text class="zz" x="246" y="18" font-size="30">Z</text>
        </g>
      </svg>
    </div>

    <div class="scene hk">
      <svg id="menorah" viewBox="0 0 340 214" role="img" aria-label="A menorah and a dreidel">
        <defs>
          <radialGradient id="glowG"><stop offset="0" stop-color="#ffd76a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
          <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9f1c"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#fff6c2"/></linearGradient>
        </defs>
        <ellipse id="menorahGlow" cx="150" cy="80" rx="150" ry="80" fill="url(#glowG)"/>
        <rect x="0" y="204" width="340" height="10" fill="#0a1f45"/>
        <g id="menorahArt"></g>
        <g id="dreidel">
          <ellipse cx="300" cy="205" rx="20" ry="3" fill="#000" opacity=".25"/>
          <g id="dreidelBody">
            <rect x="296" y="114" width="8" height="22" rx="3" fill="#c7d3ea"/>
            <path d="M278 136 H322 V176 L300 204 L278 176 Z" fill="#e8eef8" stroke="#9fb3d9" stroke-width="2"/>
            <path d="M278 136 H322 V146 H278 Z" fill="#3d7fd6"/>
            <text id="dreidelLetter" x="300" y="170" text-anchor="middle" font-size="24" font-weight="800" fill="#1f4fa8" font-family="'Arial Hebrew','Noto Sans Hebrew',Arial,sans-serif">ג</text>
          </g>
        </g>
        <g fill="#e7b63c" stroke="#b8871a" stroke-width="1">
          <ellipse cx="258" cy="203" rx="9" ry="3.5"/><ellipse cx="248" cy="200" rx="9" ry="3.5"/><ellipse cx="262" cy="198" rx="9" ry="3.5"/>
        </g>
      </svg>
    </div>
    <div class="caption" id="caption" aria-live="polite"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="progress" aria-label="Shopping progress">
      <div class="prow"><span class="big" id="pct">0%</span><span class="pmeta" id="pgifts">0 of 0 gifts bought</span></div>
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
      <div class="pmeta" id="ppeople">0 of 0 people done</div>
    </section>
    <div id="lists"></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const KEY = "holidayGiftList";
  let state = {holiday:"christmas", people:[]};
  try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && Array.isArray(s.people)) state = Object.assign({holiday:"christmas"}, s); }catch(e){}
  let busyUntil = 0, confirmReset = false;
  const confirmRemove = new Set();
  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2,10);
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const isDone = p => p.gifts.length > 0 && p.gifts.every(g => g.done);
  const allDone = () => state.people.length > 0 && state.people.every(isDone);
  const find = id => state.people.find(p => p.id === id);
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };
  const hk = () => state.holiday === "hanukkah";

  // ---------- menorah drawing ----------
  const CX = 150, ARM_Y = 120, OFFS = [30,52,74,96];
  const candleXs = [CX-96,CX-74,CX-52,CX-30,CX+30,CX+52,CX+74,CX+96]; // lit right to left, like the holiday
  (function drawMenorah(){
    let s = "";
    s += `<path d="M${CX-34} 204 L${CX+34} 204 L${CX+18} 192 L${CX-18} 192 Z" fill="#e7b63c"/>`;
    s += `<rect x="${CX-5}" y="70" width="10" height="124" fill="#e7b63c"/>`;
    OFFS.forEach(d => { const ry = Math.min(d*.75, 66);
      s += `<path d="M${CX-d} ${ARM_Y} A${d} ${ry} 0 0 0 ${CX+d} ${ARM_Y}" fill="none" stroke="#e7b63c" stroke-width="6"/>`; });
    const cup = (x,y) => `<rect x="${x-9}" y="${y-4}" width="18" height="7" rx="3" fill="#f2c94c"/>`;
    const candle = (x,y,h,c) => `<rect x="${x-4.5}" y="${y-h}" width="9" height="${h}" rx="2" fill="${c}"/><line x1="${x}" y1="${y-h}" x2="${x}" y2="${y-h-4}" stroke="#333" stroke-width="1.2"/>`;
    const flame = (x,y,id) => `<path id="${id}" class="flame" d="M${x} ${y-18} C${x+6} ${y-10} ${x+5} ${y-2} ${x} ${y} C${x-5} ${y-2} ${x-6} ${y-10} ${x} ${y-18} Z" fill="url(#flameG)"/>`;
    candleXs.forEach((x,i) => { s += cup(x,ARM_Y) + candle(x,ARM_Y-4,30,i%2?"#ffffff":"#9cc3f5") + flame(x,ARM_Y-38,"fl"+i); });
    s += cup(CX,70) + candle(CX,66,30,"#ffffff") + flame(CX,66-34,"flS");
    $("menorahArt").innerHTML = s;
  })();
  const litOrder = [7,6,5,4,3,2,1,0]; // rightmost first

  function drawPlate(n){
    let out = "", placed = 0, y = 180; const rows=[5,4,3], shown = Math.min(n,12);
    for(let r=0; r<rows.length && placed<shown; r++){
      const k = Math.min(rows[r], shown-placed), start = 258-(k-1)*9;
      for(let i=0;i<k;i++){ const x = start+i*18;
        out += `<circle cx="${x}" cy="${y}" r="9" fill="var(--cookie)" stroke="#a86b33" stroke-width="1.2"/><circle cx="${x-3}" cy="${y-2}" r="1.6" fill="var(--chip)"/><circle cx="${x+3}" cy="${y+2}" r="1.6" fill="var(--chip)"/>`; }
      placed += k; y -= 9;
    }
    $("plate").innerHTML = out;
  }

  // ---------- top area ----------
  function updateTop(){
    document.documentElement.dataset.holiday = state.holiday;
    $("themeColor").setAttribute("content", hk() ? "#0f2a5c" : "#13462d");
    $("kicker").textContent = hk() ? "Hanukkah shopping" : "Christmas shopping";
    $("btnXmas").setAttribute("aria-pressed", !hk());
    $("btnHk").setAttribute("aria-pressed", hk());
    const gifts = state.people.flatMap(p => p.gifts);
    const got = gifts.filter(g => g.done).length;
    const pct = gifts.length ? Math.round(got/gifts.length*100) : 0;
    const total = state.people.length, done = state.people.filter(isDone).length, left = total - done;
    $("pct").textContent = pct + "%";
    $("pgifts").textContent = `${got} of ${gifts.length} gift${gifts.length===1?"":"s"} bought`;
    $("ppeople").textContent = `${done} of ${total} ${total===1?"person":"people"} done`;
    $("fill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", pct);
    $("bar").classList.toggle("full", pct === 100);
    const busy = Date.now() < busyUntil;

    // Christmas scene
    drawPlate(left);
    $("santa").classList.toggle("napping", allDone() && !busy);
    // Hanukkah scene: shamash always lit; candles light in proportion to people finished
    const lit = allDone() ? 8 : (total ? Math.floor(8*done/total) : 0);
    $("flS").classList.add("on");
    litOrder.forEach((ci,k) => $("fl"+ci).classList.toggle("on", k < lit));
    $("menorah").classList.toggle("alllit", allDone());

    if(busy) return;
    let msg;
    if(!total) msg = hk() ? "Add the people you shop for. The menorah lights up as you finish them." : "Add the people you shop for. Santa gets one cookie per person.";
    else if(allDone()) msg = hk() ? "Every gift is bought. The whole menorah is lit. Chag sameach!" : "Every gift is bought. Santa ate all the cookies and is sleeping it off.";
    else if(hk()) msg = `${lit} of 8 candles lit. Finish everyone to light the whole menorah.`;
    else msg = `${left} cookie${left===1?"":"s"} on the plate: one for each person still on your list.`;
    $("caption").textContent = msg;
  }

  // ---------- cards ----------
  function card(p){
    const done = isDone(p), got = p.gifts.filter(g=>g.done).length;
    const items = p.gifts.length ? p.gifts.map(g => `
      <li class="${g.done?"got":""}">
        <button class="check" role="checkbox" aria-checked="${g.done}" aria-label="Bought: ${esc(g.text)}" data-act="toggle" data-p="${p.id}" data-g="${g.id}">
          <svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="gtext">${esc(g.text)}</span>
        <button class="yearly" aria-pressed="${!!g.annual}" data-act="annual" data-p="${p.id}" data-g="${g.id}">${g.annual?"Every year":"One-time"}</button>
        <button class="x" aria-label="Delete ${esc(g.text)}" data-act="delgift" data-p="${p.id}" data-g="${g.id}">×</button>
      </li>`).join("") : `<li class="empty">No gift ideas yet.</li>`;
    const rm = confirmRemove.has(p.id)
      ? `<div class="add" style="justify-content:flex-end"><button class="btn ghost" data-act="cancelrm" data-p="${p.id}">Keep</button><button class="btn warn" data-act="rmperson" data-p="${p.id}">Remove ${esc(p.name)}</button></div>`
      : `<button class="rm" data-act="askrm" data-p="${p.id}">Remove ${esc(p.name)}</button>`;
    return `<article class="card ${done?"done":""}">
      <div class="chead"><span class="cname">${esc(p.name)}</span><span class="count">${got}/${p.gifts.length}</span>${done?`<span class="pill">Done</span>`:""}</div>
      <ul>${items}</ul>
      <form class="add" data-p="${p.id}">
        <input id="add-${p.id}" type="text" placeholder="Add a gift for ${esc(p.name)}" aria-label="New gift for ${esc(p.name)}" autocomplete="off" enterkeyhint="done">
        <button class="btn" type="submit">Add</button>
      </form>
      ${rm}
    </article>`;
  }
  function section(group, title, ph){
    const ps = state.people.filter(p => (p.group||"family") === group);
    return `<section class="section"><h2>${title}</h2>
      ${ps.length ? `<div class="grid">${ps.map(card).join("")}</div>` : ""}
      <form class="addp" data-group="${group}"><input id="addp-${group}" type="text" placeholder="${ph}" aria-label="${ph}" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">Add</button></form>
    </section>`;
  }
  function render(){
    updateTop();
    const drafts = {}; document.querySelectorAll("#lists input").forEach(i => drafts[i.id] = i.value);
    const focused = document.activeElement && document.activeElement.id;
    let html = "";
    if(!state.people.length) html += `<div class="intro"><b>Start here:</b> add the people you shop for under Family and Friends, then add gift ideas on each card. Check gifts off as you buy them.</div>`;
    html += section("family","Family","Add a family member");
    html += section("friends","Friends","Add a friend");
    if(state.people.length) html += `<section class="reset">
      <div>Done for the year? Start next year's list: "Every year" gifts stay and get unchecked, one-time gifts are cleared.</div>
      ${confirmReset ? `<div class="row"><button class="btn" data-act="doreset">Yes, start next year</button><button class="btn ghost" data-act="cancelreset">Cancel</button></div>`
                     : `<button class="btn ghost" data-act="askreset">Start next year's list</button>`}
    </section>`;
    $("lists").innerHTML = html;
    for(const id in drafts){ const el = $(id); if(el) el.value = drafts[id]; }
    if(focused && $(focused)) $(focused).focus();
  }

  // ---------- celebrations ----------
  let toastT;
  function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 3200); }
  function eat(name, final){
    const s = $("santa");
    busyUntil = Date.now() + 2700;
    s.classList.remove("napping","eating"); void s.getBoundingClientRect(); s.classList.add("eating");
    $("caption").textContent = final ? `${name} is done, and so are you! Santa's eating the last cookie…` : `${name} is all set. Santa's having a cookie to celebrate!`;
    setTimeout(()=>{ s.classList.remove("eating"); busyUntil = 0; updateTop(); }, 2750);
  }
  const LETTERS = [["נ","Nun"],["ג","Gimel"],["ה","Hei"],["ש","Shin"]];
  function spin(name, final){
    const m = $("menorah"), L = $("dreidelLetter");
    busyUntil = Date.now() + 2500;
    m.classList.remove("spinning"); void m.getBoundingClientRect(); m.classList.add("spinning");
    $("caption").textContent = `${name} is all set. Spin the dreidel!`;
    let i = 0; const iv = setInterval(()=>{ L.textContent = LETTERS[i++ % 4][0]; }, 110);
    setTimeout(()=>{
      clearInterval(iv);
      const pick = final ? LETTERS[1] : LETTERS[Math.floor(Math.random()*4)];
      L.textContent = pick[0];
      m.classList.remove("spinning"); busyUntil = 0; updateTop();
      $("caption").textContent = final ? `${pick[1]}! You take it all. The whole menorah is lit. Chag sameach!` : `${pick[1]}! ${name} is done.`;
    }, 2450);
  }
  function celebrate(name, final){
    toast(final ? "Shopping complete!" : `${name}: done!`);
    hk() ? spin(name, final) : eat(name, final);
  }

  // ---------- actions ----------
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act],[data-hol]"); if(!b) return;
    if(b.dataset.hol){ state.holiday = b.dataset.hol; busyUntil = 0; save(); render(); return; }
    const act = b.dataset.act, p = b.dataset.p && find(b.dataset.p);
    if(act === "toggle" && p){
      const g = p.gifts.find(x => x.id === b.dataset.g); if(!g) return;
      const was = isDone(p); g.done = !g.done; save();
      if(!was && isDone(p)) celebrate(p.name, allDone());
      render();
    } else if(act === "annual" && p){
      const g = p.gifts.find(x => x.id === b.dataset.g); if(g){ g.annual = !g.annual; save(); render(); }
    } else if(act === "delgift" && p){ p.gifts = p.gifts.filter(x => x.id !== b.dataset.g); save(); render(); }
    else if(act === "askrm"){ confirmRemove.add(b.dataset.p); render(); }
    else if(act === "cancelrm"){ confirmRemove.delete(b.dataset.p); render(); }
    else if(act === "rmperson"){ state.people = state.people.filter(x => x.id !== b.dataset.p); confirmRemove.delete(b.dataset.p); save(); render(); }
    else if(act === "askreset"){ confirmReset = true; render(); }
    else if(act === "cancelreset"){ confirmReset = false; render(); }
    else if(act === "doreset"){
      state.people.forEach(pp => { pp.gifts = pp.gifts.filter(g => g.annual).map(g => ({...g, done:false})); });
      confirmReset = false; save(); render(); toast("Fresh list for next year.");
    }
  });
  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target, input = f.querySelector("input"), text = input.value.trim(); if(!text) return;
    if(f.dataset.group) state.people.push({id:uid(), name:text, group:f.dataset.group, gifts:[]});
    else { const p = find(f.dataset.p); if(!p) return; p.gifts.push({id:uid(), text, done:false, annual:false}); }
    input.value = ""; save(); render();
    const again = $(f.dataset.group ? "addp-"+f.dataset.group : "add-"+f.dataset.p); if(again) again.focus();
  });

  render();
})();
</script>
</body>
</html>
